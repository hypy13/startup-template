[project]
name = "startup-api"
version = "0.1.0"
description = "Django backend for the startup template"
requires-python = ">=3.12,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "django-daisy>=2.0.15,<3",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.5,<6",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
