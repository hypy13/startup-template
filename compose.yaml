services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-startup}
      POSTGRES_USER: ${POSTGRES_USER:-startup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment: &api_environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-startup}
      POSTGRES_USER: ${POSTGRES_USER:-startup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on: &api_dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
    ports:
      - "8000:8000"
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    command: celery -A config worker -l info
    environment: *api_environment
    depends_on: *api_dependencies
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/repo/apps/web
      - web_node_modules:/repo/apps/web/node_modules
      - web_next:/repo/apps/web/.next
    ports:
      - "3000:3000"
volumes:
  postgres_data:
  api_venv:
  web_node_modules:
  web_next:
