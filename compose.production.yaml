services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: base
    restart: unless-stopped
    environment: &api_environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Required}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on: &api_dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000'
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: base
    restart: unless-stopped
    command: celery -A config worker -l info
    environment: *api_environment
    depends_on: *api_dependencies
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  postgres_data:
